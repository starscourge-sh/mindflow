<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B2B2D"/><stop offset="1" stop-color="#19191A"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.34"/><stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.08"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.16"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0.3" y2="1"><stop offset="0" stop-color="#8E6A0E"/><stop offset="1" stop-color="#6E4F05"/></linearGradient><linearGradient id="rimgold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F2C24A"/><stop offset="1" stop-color="#C9961C"/></linearGradient>
    <filter id="tile" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/></filter>
    <!-- A fine grain over the gold, as pressed foil has. -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9 0.25" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.3  0 0 0 0 0  0 0 0 0.22 0" result="tint"/>
      <feComposite in="tint" in2="SourceGraphic" operator="in" result="grained"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="grained"/></feMerge>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/></filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#tile)"/>
  <rect x="104" y="104" width="816" height="816" rx="181" fill="none" stroke="url(#rim)" stroke-width="8"/>
  <rect x="112" y="112" width="800" height="800" rx="173" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="6"/>
  <!-- “Leaves”: the leaves outlined in gold over a deepening gold fill. -->
  <image href="mark-leaves.png" x="232" y="242" width="560" height="570" filter="url(#lift)"/>
</svg>
