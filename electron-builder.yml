# Was com.starskourge.vigil until the rename: macOS knows an app by this, so a
# packaged build asks once more for every permission (calendar, camera, Notes).
appId: com.starskourge.haligtree
# The name people see; src/main/name.ts says it inside the app.
productName: Haligtree
directories:
  buildResources: build
files:
  # Only what the app runs on: the built code, its resources and package.json
  # (electron-builder adds the packages main loads). Anything else in the
  # folder (notes, tests, probes, other builds, helpers' work) never ships.
  - 'out/**'
  - '!out/**/*.map'
  - 'resources/**'
  - 'package.json'
asarUnpack:
  - resources/**
# Haligtree in Finder's "Open With" for Markdown and PDFs (main: fromFinder). Alternate: offered,
# never made the default behind your back; pick it as the default in Get Info if you want it.
fileAssociations:
  - ext: [md, markdown]
    name: Markdown document
    role: Viewer
    rank: Alternate
    mimeType: text/markdown
  - ext: pdf
    name: PDF document
    role: Viewer
    rank: Alternate
    mimeType: application/pdf
win:
  executableName: haligtree
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  # Signed by this Mac alone (no Apple Developer ID yet): a whole, valid
  # signature, so another Mac sees an app from an unknown developer to allow,
  # not a "damaged" one to bin. Electron's own leftover signature, unsigned
  # over, is broken once its files are changed.
  identity: '-'
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # A plain map, so each key lands at the top of Info.plist where macOS reads it.
  # Haligtree listens only while you record a voice note, and never uses Bluetooth, so
  # Electron's own defaults for the rest are taken out (null removes a key) and the Mac never asks for them.
  extendInfo:
    # "Send to Haligtree" in every app's Services menu (right-click picked words): native/services.mm.
    NSServices:
      - NSMenuItem:
          default: Send to Haligtree
        NSMessage: sendToHaligtree
        NSPortName: Haligtree
        NSSendTypes:
          - NSStringPboardType
          - public.utf8-plain-text
        NSRequiredContext: {}
      # The same for files picked in Finder (right-click, Quick Actions): any file. Markdown and text come in as notes; the rest go in Files.
      - NSMenuItem:
          default: Send to Haligtree
        NSMessage: sendFilesToHaligtree
        NSPortName: Haligtree
        NSSendFileTypes:
          - public.image
          - com.adobe.pdf
          - public.audio
          - public.movie
          - net.daringfireball.markdown
          - public.plain-text
          - public.data
        NSRequiredContext: {}
    NSMicrophoneUsageDescription: Haligtree uses the microphone only while you record a voice note or a meeting, or hold the talk key to type by talking. Everything stays on this Mac and is sent nowhere.
    NSAudioCaptureUsageDescription: Haligtree records the sound from this Mac (the other side of a call, in its app or the browser) only while you record a meeting. Everything stays on this Mac and is sent nowhere.
    # Asked once, the first time a voice note is turned into words; the words are made on this Mac (native/transcribe.swift).
    NSSpeechRecognitionUsageDescription: Haligtree turns your voice notes into words on this Mac, only when you ask. Nothing is sent anywhere.
    NSBluetoothAlwaysUsageDescription: null
    NSBluetoothPeripheralUsageDescription: null
    NSCameraUsageDescription: Haligtree uses the camera only when you take a selfie for a study session's log. Nothing is recorded or sent anywhere.
    NSDocumentsFolderUsageDescription: Haligtree opens only the folders you choose in Documents, such as an Obsidian vault to bring in or a folder of pictures.
    NSDownloadsFolderUsageDescription: Haligtree opens only the folders you choose in Downloads, such as a folder of pictures.
    NSCalendarsUsageDescription: Haligtree reads your calendar's events to show them on Today and the week. It never changes them.
    NSCalendarsFullAccessUsageDescription: Haligtree reads your calendar's events to show them on Today and the week. It never changes them.
    NSContactsUsageDescription: Haligtree looks in your Contacts only when you click “Link a contact” on a person's page, for the contacts with that person's name, and keeps the one you pick with their photo. It never changes your Contacts and sends nothing anywhere.
    NSRemindersUsageDescription: Haligtree puts a task in your Reminders when you ask it to, and ticks it done here when you tick it there. It reads no other reminders.
    NSRemindersFullAccessUsageDescription: Haligtree puts a task in your Reminders when you ask it to, and ticks it done here when you tick it there. It reads no other reminders.
    NSAppleEventsUsageDescription: Haligtree reads your notes from Notes when you import them; the address of the page open in your browser during a focus session, to send blocked websites away; and that page's address and name when you add it to a quick capture. It never changes them and sends nothing anywhere.
    # Names .md files as Markdown for a Mac that does not know them, so the
    # Quick Look preview below is picked for them.
    UTImportedTypeDeclarations:
      - UTTypeIdentifier: net.daringfireball.markdown
        UTTypeDescription: Markdown document
        UTTypeConformsTo:
          - public.plain-text
        UTTypeTagSpecification:
          public.filename-extension:
            - md
            - markdown
          public.mime-type:
            - text/markdown
  # Finder's Space on a .md file shows it in Haligtree's look. Built and signed
  # (with its own sandbox) by native/build-quicklook.sh; electron-builder never
  # re-signs what is in Contents/PlugIns, so that signature stays.
  extraFiles:
    - from: build/quicklook/HaligtreeQuickLook.appex
      to: PlugIns/HaligtreeQuickLook.appex
  notarize: false
dmg:
  artifactName: Haligtree-${version}.${ext}
  # The disk's icon once opened; the .dmg file's own is set by the step below.
  icon: build/icon.icns
# Each .dmg gets Haligtree's icon in Finder too.
afterAllArtifactBuild: build/stamp-dmg-icon.cjs
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: Haligtree
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
