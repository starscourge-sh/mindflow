# Was com.starskourge.vigil until the rename: macOS knows an app by this, so a
# packaged build asks once more for every permission (calendar, camera, Notes).
appId: com.starskourge.haligtree
# The name people see; src/main/name.ts says it inside the app.
productName: Haligtree
directories:
  buildResources: build
files:
  # Only what the app runs on: the built code, its resources and package.json
  # (electron-builder adds the packages main loads). Anything else in the
  # folder (notes, tests, probes, other builds, helpers' work) never ships.
  - 'out/**'
  - '!out/**/*.map'
  - 'resources/**'
  - 'package.json'
asarUnpack:
  - resources/**
win:
  executableName: haligtree
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  # Signed by this Mac alone (no Apple Developer ID yet): a whole, valid
  # signature, so another Mac sees an app from an unknown developer to allow,
  # not a "damaged" one to bin. Electron's own leftover signature, unsigned
  # over, is broken once its files are changed.
  identity: '-'
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # A plain map, so each key lands at the top of Info.plist where macOS reads it.
  # Haligtree never listens or uses Bluetooth, so Electron's own defaults for those
  # are taken out (null removes a key) and the Mac never asks for them.
  extendInfo:
    NSMicrophoneUsageDescription: null
    NSAudioCaptureUsageDescription: null
    NSBluetoothAlwaysUsageDescription: null
    NSBluetoothPeripheralUsageDescription: null
    NSCameraUsageDescription: Haligtree uses the camera only when you take a selfie for a study session's log. Nothing is recorded or sent anywhere.
    NSDocumentsFolderUsageDescription: Haligtree opens only the folders you choose in Documents, such as an Obsidian vault to bring in or a folder of pictures.
    NSDownloadsFolderUsageDescription: Haligtree opens only the folders you choose in Downloads, such as a folder of pictures.
    NSCalendarsUsageDescription: Haligtree reads your calendar's events to show them on Today and the week. It never changes them.
    NSCalendarsFullAccessUsageDescription: Haligtree reads your calendar's events to show them on Today and the week. It never changes them.
    NSAppleEventsUsageDescription: Haligtree reads your notes from Notes when you import them, and during a focus session the address of the page open in your browser, to send blocked websites away. It never changes them and sends nothing anywhere.
  notarize: false
dmg:
  artifactName: Haligtree-${version}.${ext}
  # The disk's icon once opened; the .dmg file's own is set by the step below.
  icon: build/icon.icns
# Each .dmg gets Haligtree's icon in Finder too.
afterAllArtifactBuild: build/stamp-dmg-icon.cjs
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: Haligtree
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
