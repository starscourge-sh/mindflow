appId: com.starskourge.vigil
productName: Vigil
directories:
  buildResources: build
files:
  # Only what the app runs on: the built code, its resources and package.json
  # (electron-builder adds the packages main loads). Anything else in the
  # folder (notes, tests, probes, other builds, helpers' work) never ships.
  - 'out/**'
  - '!out/**/*.map'
  - 'resources/**'
  - 'package.json'
asarUnpack:
  - resources/**
win:
  executableName: mindflow
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Vigil uses the camera only when you take a selfie for a study session's log. Nothing is recorded or sent anywhere.
    - NSDocumentsFolderUsageDescription: Vigil opens only the folders you choose in Documents, such as an Obsidian vault to bring in or a folder of pictures.
    - NSDownloadsFolderUsageDescription: Vigil opens only the folders you choose in Downloads, such as a folder of pictures.
    - NSCalendarsUsageDescription: Vigil reads your calendar's events to show them on Today and the week. It never changes them.
    - NSCalendarsFullAccessUsageDescription: Vigil reads your calendar's events to show them on Today and the week. It never changes them.
    - NSAppleEventsUsageDescription: During a focus session, Vigil reads the address of the page open in your browser, so it can send blocked websites away. It never reads anything else and sends nothing anywhere.
  notarize: false
dmg:
  artifactName: Vigil-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish:
  provider: generic
  url: https://example.com/auto-updates
